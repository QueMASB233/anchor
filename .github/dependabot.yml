version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # One PR for the dev toolchain instead of a dozen. Runtime dependencies
      # stay ungrouped so each is reviewed on its own — they ship to users.
      dev-tooling:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
