name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Anchor's CI reads code and runs tests. It never needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Anchor must never phone home, and its own CI must never depend on a network
  # call to a model provider. Fail loudly if a test tries.
  ANCHOR_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  action-dist:
    name: Action bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rebuild the action bundle
        run: pnpm --filter @eleva/anchor-action run build

      - name: Fail if the committed bundle differs
        run: |
          if [ -n "$(git status --porcelain packages/action/dist)" ]; then
            echo "::error::packages/action/dist is stale. Run 'pnpm --filter @eleva/anchor-action run build' and commit the result."
            git --no-pager diff --stat packages/action/dist
            exit 1
          fi

      # The unit tests import src/, so they cannot catch a bundle that fails to
      # boot — which is exactly what happened when the bundle was ESM and its
      # CommonJS dependencies could not `require('tty')`. This runs the real
      # artifact, from a directory with no node_modules in scope.
      - name: Smoke-test the bundle end to end
        run: |
          set -euo pipefail
          WS="$(mktemp -d)"
          mkdir -p "$WS/src"
          cp packages/action/dist/bin.cjs "$WS/"
          echo "module.exports = { theme: { spacing: { 3: '12px', 4: '16px' } } };" > "$WS/tailwind.config.js"
          echo 'export const B = () => <div className="p-[13px]" />;' > "$WS/src/Bad.tsx"
          echo '{ "tokens": ["tailwind.config.js"], "include": ["src/**/*.tsx"] }' > "$WS/anchor.config.json"
          : > "$WS/outputs"

          set +e
          ( cd "$WS" && \
            GITHUB_WORKSPACE="$WS" GITHUB_OUTPUT="$WS/outputs" \
            GITHUB_REPOSITORY="acme/web" GITHUB_EVENT_NAME="push" \
            INPUT_COMMENT="false" INPUT_STRICT="true" \
            node "$WS/bin.cjs" )
          code=$?
          set -e

          if [ "$code" -ne 1 ]; then
            echo "::error::The bundled action exited $code; expected 1 for a strict run with one error."
            exit 1
          fi
          grep -q "errors<<" "$WS/outputs" || { echo "::error::The bundle wrote no step outputs."; exit 1; }
          echo "Bundle boots and reports correctly."
