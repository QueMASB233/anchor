name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Anchor's CI reads code and runs tests. It never needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Anchor must never phone home, and its own CI must never depend on a network
  # call to a model provider. Fail loudly if a test tries.
  ANCHOR_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  action-dist:
    name: Action bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rebuild the action bundle
        run: pnpm --filter @eleva/anchor-action run build

      - name: Fail if the committed bundle differs
        run: |
          if [ -n "$(git status --porcelain packages/action/dist)" ]; then
            echo "::error::packages/action/dist is stale. Run 'pnpm --filter @eleva/anchor-action run build' and commit the result."
            git --no-pager diff --stat packages/action/dist
            exit 1
          fi
