name: 'Anchor Design System Lint'
description: 'Enforce your design system on AI-generated code. Deterministic, offline, no code leaves your runner.'
author: 'Eleva Builds'

branding:
  icon: 'anchor'
  color: 'blue'

inputs:
  check:
    description: 'Files to lint, as globs. Newline- or comma-separated. Defaults to the `include` in anchor.config.'
    required: false
  config:
    description: 'Path to anchor.config. Defaults to cosmiconfig discovery from the workspace root.'
    required: false
  strict:
    description: 'Fail the job when any error-severity violation is found. Warnings never fail the job.'
    required: false
    default: 'true'
  comment:
    description: 'Post a summary comment on the pull request, updating Anchor’s previous one. Requires `pull-requests: write`.'
    required: false
    default: 'true'
  format:
    description: 'Reporter for job output: github (inline annotations), terminal, json, or sarif.'
    required: false
    default: 'github'
  since:
    description: 'Only lint files changed against this git ref. Needs `fetch-depth: 0` on the checkout step.'
    required: false
  github-token:
    description: 'Token used only to post the pull request comment. Never used to fetch or execute repository code.'
    required: false
    default: ${{ github.token }}

outputs:
  violations:
    description: 'Total number of violations found.'
  errors:
    description: 'Number of error-severity violations.'
  warnings:
    description: 'Number of warning-severity violations.'
  files-checked:
    description: 'Number of files linted.'

runs:
  using: 'node20'
  main: 'dist/bin.cjs'
